<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Enlighten</title>
    <meta name="theme-color" content="#DFDDD3">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    
    <style>
        :root {
            --bg: #DFDDD3;
            --text: #233130;
            --text-secondary: #85937D;
            --surface: #FFFFFF;
            --border: #C5C3B8;
            --shadow-sm: 0 2px 4px rgba(35,49,48,0.1);
            --shadow-md: 0 8px 16px rgba(35,49,48,0.15);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.3s ease;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .admin-container { display: flex; min-height: 100vh; }

        .admin-sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            position: fixed;
            top: 0; left: 0; bottom: 0;
            padding: 0.75rem;
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .admin-sidebar-header {
            padding: 0.75rem;
            text-align: center;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-text {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #233130, #85937D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .close-sidebar-btn { display: none; background: none; border: none; cursor: pointer; color: var(--text); }

        .admin-main {
            flex: 1;
            margin-left: 250px;
            padding: 1.5rem;
            min-width: 0;
        }

        .admin-sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 3px;
            font-size: 0.9rem;
        }
        .admin-sidebar-item:hover { background: var(--bg); color: var(--text); }
        .admin-sidebar-item.active { background: var(--text); color: var(--bg); }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        .sidebar-overlay.active { display: block; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .top-bar-left { display: flex; align-items: center; gap: 0.75rem; }

        .mobile-menu-btn {
            display: none;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px;
            cursor: pointer;
            color: var(--text);
        }

        .admin-title { font-family: var(--font-heading); font-size: 1.8rem; font-weight: 700; }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            white-space: nowrap;
        }
        .btn-primary { background: var(--text); color: var(--bg); }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background: #DC2626; color: white; }
        .btn-sm { padding: 5px 10px; font-size: 0.75rem; }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
            transition: var(--transition);
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--text);
        }

        .class-checkboxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }

        .class-checkbox {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem;
            background: var(--bg);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8rem;
        }
        .class-checkbox input[type="checkbox"] { accent-color: var(--text); width: 16px; height: 16px; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
        }

        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            min-width: 600px;
        }
        .data-table th {
            padding: 0.75rem;
            text-align: left;
            background: var(--bg);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .data-table td {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.75rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.25rem;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        .stat-card .material-icons { font-size: 2rem; color: var(--text); }
        .stat-card h2 { margin-top: 0.35rem; font-size: 1.3rem; }
        .stat-card p { color: var(--text-secondary); font-size: 0.85rem; }

        .load-more-btn {
            display: block;
            margin: 0.75rem auto;
            padding: 10px 28px;
            border-radius: 24px;
            background: var(--surface);
            border: 2px solid var(--border);
            cursor: pointer;
            font-weight: 500;
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        .load-more-btn:hover { background: var(--text); color: var(--bg); }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-secondary);
        }
        .empty-state .material-icons { font-size: 3rem; margin-bottom: 0.5rem; }
        .empty-state h3 { font-size: 1.1rem; margin-bottom: 0.25rem; }
        .empty-state p { font-size: 0.85rem; }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg);
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 3000;
            display: none;
            font-size: 0.9rem;
            box-shadow: var(--shadow-md);
        }
        .toast.show { display: block; }
        .toast.error { background: #DC2626; color: white; }
        .toast.success { background: #059669; color: white; }

        .email-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .email-badge.active { background: #D1FAE5; color: #059669; }
        .email-badge.inactive { background: #FEE2E2; color: #DC2626; }

        @media (min-width: 769px) {
            .admin-sidebar { transform: translateX(0) !important; }
            .sidebar-overlay { display: none !important; }
        }

        @media (max-width: 768px) {
            .admin-sidebar { width: 260px; transform: translateX(-100%); padding: 0.5rem; }
            .admin-sidebar.open { transform: translateX(0); box-shadow: var(--shadow-md); }
            .close-sidebar-btn { display: block; }
            .admin-main { margin-left: 0; padding: 1rem; }
            .mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
            .admin-title { font-size: 1.5rem; }
            .btn { padding: 7px 14px; font-size: 0.8rem; }
            .modal-content { padding: 1.25rem; }
            .class-checkboxes { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
            .class-checkbox { padding: 0.35rem; font-size: 0.75rem; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
            .stat-card { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

        <div class="admin-sidebar" id="adminSidebar">
            <div class="admin-sidebar-header">
                <span class="logo-text">Enlighten</span>
                <button class="close-sidebar-btn" onclick="closeSidebar()" aria-label="Close menu">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div class="admin-sidebar-item active" onclick="handleMobileTabClick('dashboard')">
                <span class="material-icons">dashboard</span><span>Dashboard</span>
            </div>
            <div class="admin-sidebar-item" onclick="handleMobileTabClick('whitelist')">
                <span class="material-icons">verified_user</span><span>Students</span>
            </div>
            <div class="admin-sidebar-item" onclick="handleMobileTabClick('videos')">
                <span class="material-icons">video_library</span><span>Videos</span>
            </div>
            <div class="admin-sidebar-item" onclick="handleMobileTabClick('pdfs')">
                <span class="material-icons">picture_as_pdf</span><span>PDFs</span>
            </div>
            <div class="admin-sidebar-item" onclick="handleMobileTabClick('images')">
                <span class="material-icons">image</span><span>Images</span>
            </div>
            <div class="admin-sidebar-item" onclick="handleMobileTabClick('posts')">
                <span class="material-icons">article</span><span>Posts</span>
            </div>
            <div class="admin-sidebar-item" onclick="logout()">
                <span class="material-icons">logout</span><span>Logout</span>
            </div>
        </div>

        <div class="admin-main">
            <div class="top-bar">
                <div class="top-bar-left">
                    <button class="mobile-menu-btn" onclick="openSidebar()" aria-label="Open menu">
                        <span class="material-icons">menu</span>
                    </button>
                    <h1 class="admin-title" id="adminTitle">Dashboard</h1>
                </div>
                <button class="btn btn-primary" id="addBtn" onclick="showAddForm()">
                    <span class="material-icons">add</span> Add New
                </button>
            </div>
            <div id="adminContent"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
                <h2 id="modalTitle" style="font-family:var(--font-heading);font-size:1.3rem;">Add New</h2>
                <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--text);" aria-label="Close">✕</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDQJeB1o4W6KnC_OlxGc1u1aPWsv40bICo",
            authDomain: "genesis-aec98.firebaseapp.com",
            projectId: "genesis-aec98",
            storageBucket: "genesis-aec98.firebasestorage.app",
            messagingSenderId: "1071823452533",
            appId: "1:1071823452533:web:ff7a7dd592249a6ea1fb3c"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const allClasses = ['Class 6','Class 7','Class 8','Class 9','Class 10','Class 11','Class 12','Jamia Entrance','JNU Entrance','DU Entrance','AMU Entrance','CUET'];
        const allSubjects = ['Geography','History','Economics','Social Science','General Knowledge','Mathematics','Hindi','Urdu','Computer','Biology','Zoology','Physics','Chemistry','Science','English','Current Affairs','Quant','Coding','AI'];

        let currentTab = 'dashboard';
        let cachedData = [];
        let displayedCount = 0;
        const PAGE_SIZE = 5;
        let isSubmitting = false;

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sanitizeInput(text) {
            if (!text) return '';
            return text.replace(/[<>]/g, '').trim();
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function openSidebar() {
            document.getElementById('adminSidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            document.getElementById('adminSidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function handleMobileTabClick(tab) {
            if (window.innerWidth <= 768) closeSidebar();
            switchTab(tab);
        }

        // Check admin authentication using Firebase Auth
        function checkAdminAuth() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    // CHANGE THIS TO YOUR ADMIN EMAIL
                    const adminEmail = 'khanshoib82@gmail.com';
                    
                    if (user.email === adminEmail) {
                        // Admin verified
                        switchTab('dashboard');
                    } else {
                        alert('Access denied. Admin only.');
                        auth.signOut();
                        window.location.href = 'index.html';
                    }
                } else {
                    // No user logged in, redirect to login
                    window.location.href = 'index.html';
                }
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            cachedData = [];
            displayedCount = 0;
            
            document.querySelectorAll('.admin-sidebar-item').forEach(item => item.classList.remove('active'));
            const tabs = ['dashboard','whitelist','videos','pdfs','images','posts'];
            const index = tabs.indexOf(tab);
            if (index !== -1) document.querySelectorAll('.admin-sidebar-item')[index].classList.add('active');
            
            const titles = {
                dashboard: 'Dashboard',
                whitelist: 'Student Management',
                videos: 'Video Management',
                pdfs: 'PDF Management',
                images: 'Image Management',
                posts: 'Post Management'
            };
            document.getElementById('adminTitle').textContent = titles[tab] || 'Dashboard';
            document.getElementById('addBtn').style.display = tab === 'dashboard' ? 'none' : 'inline-flex';
            
            switch(tab) {
                case 'dashboard': loadDashboard(); break;
                case 'whitelist': loadData('whitelist'); break;
                case 'videos': loadData('videos'); break;
                case 'pdfs': loadData('pdfs'); break;
                case 'images': loadData('images'); break;
                case 'posts': loadData('posts'); break;
            }
        }

        function showAddForm() {
            const modal = document.getElementById('modalOverlay');
            const modalBody = document.getElementById('modalBody');
            
            if (currentTab === 'whitelist') {
                document.getElementById('modalTitle').textContent = 'Add Student';
                modalBody.innerHTML = `
                    <input type="text" id="studentName" class="form-input" placeholder="Student Full Name" maxlength="50" required>
                    <input type="email" id="studentEmail" class="form-input" placeholder="Student Gmail Address" required>
                    <label style="font-weight:500;margin-bottom:0.4rem;display:block;font-size:0.85rem;">Assign Classes:</label>
                    <div class="class-checkboxes">
                        ${allClasses.map(cls => `
                            <label class="class-checkbox">
                                <input type="checkbox" value="${cls}" class="class-check"> ${cls}
                            </label>
                        `).join('')}
                    </div>
                    <button class="btn btn-primary" onclick="addToWhitelist()" id="submitBtn">Add Student</button>
                `;
            } else {
                document.getElementById('modalTitle').textContent = 'Add New';
                switch(currentTab) {
                    case 'videos':
                        modalBody.innerHTML = `
                            <input type="text" id="videoTitle" class="form-input" placeholder="Video Title" maxlength="100">
                            <input type="url" id="videoUrl" class="form-input" placeholder="YouTube URL" maxlength="500">
                            <select id="videoClass" class="form-select">
                                <option value="">Select Class</option>
                                ${allClasses.map(cls => `<option value="${cls}">${cls}</option>`).join('')}
                            </select>
                            <select id="videoSubject" class="form-select">
                                <option value="">Select Subject</option>
                                ${allSubjects.map(sub => `<option value="${sub}">${sub}</option>`).join('')}
                            </select>
                            <input type="text" id="videoDuration" class="form-input" placeholder="Duration (e.g., 45:30)" maxlength="20">
                            <textarea id="videoDescription" class="form-textarea" placeholder="Description" rows="3" maxlength="500"></textarea>
                            <button class="btn btn-primary" onclick="addVideo()" id="submitBtn">Add Video</button>
                        `;
                        break;
                        
                    case 'pdfs':
                        modalBody.innerHTML = `
                            <input type="text" id="pdfTitle" class="form-input" placeholder="PDF Title" maxlength="100">
                            <input type="url" id="pdfUrl" class="form-input" placeholder="PDF URL" maxlength="500">
                            <select id="pdfClass" class="form-select">
                                <option value="">Select Class</option>
                                ${allClasses.map(cls => `<option value="${cls}">${cls}</option>`).join('')}
                            </select>
                            <select id="pdfSubject" class="form-select">
                                <option value="">Select Subject</option>
                                ${allSubjects.map(sub => `<option value="${sub}">${sub}</option>`).join('')}
                            </select>
                            <button class="btn btn-primary" onclick="addPDF()" id="submitBtn">Add PDF</button>
                        `;
                        break;
                        
                    case 'images':
                        modalBody.innerHTML = `
                            <input type="text" id="imageTitle" class="form-input" placeholder="Image Title" maxlength="100">
                            <input type="url" id="imageUrl" class="form-input" placeholder="Image URL" maxlength="500">
                            <select id="imageClass" class="form-select">
                                <option value="">Select Class</option>
                                ${allClasses.map(cls => `<option value="${cls}">${cls}</option>`).join('')}
                            </select>
                            <select id="imageSubject" class="form-select">
                                <option value="">Select Subject</option>
                                ${allSubjects.map(sub => `<option value="${sub}">${sub}</option>`).join('')}
                            </select>
                            <textarea id="imageDescription" class="form-textarea" placeholder="Description" rows="3" maxlength="500"></textarea>
                            <button class="btn btn-primary" onclick="addImage()" id="submitBtn">Add Image</button>
                        `;
                        break;
                        
                    case 'posts':
                        modalBody.innerHTML = `
                            <input type="text" id="postTitle" class="form-input" placeholder="Post Title" maxlength="100">
                            <textarea id="postContent" class="form-textarea" placeholder="Content" rows="4" maxlength="2000"></textarea>
                            <input type="url" id="postUrl" class="form-input" placeholder="URL (Optional)" maxlength="500">
                            <label style="font-weight:500;margin-bottom:0.4rem;display:block;font-size:0.85rem;">Target Classes:</label>
                            <div class="class-checkboxes">
                                ${allClasses.map(cls => `
                                    <label class="class-checkbox">
                                        <input type="checkbox" value="${cls}" class="post-class-check"> ${cls}
                                    </label>
                                `).join('')}
                            </div>
                            <select id="postSubject" class="form-select">
                                <option value="">Select Subject (Optional)</option>
                                ${allSubjects.map(sub => `<option value="${sub}">${sub}</option>`).join('')}
                            </select>
                            <button class="btn btn-primary" onclick="addPost()" id="submitBtn">Add Post</button>
                        `;
                        break;
                }
            }
            
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';
            isSubmitting = false;
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        async function addToWhitelist() {
            if (isSubmitting) return;
            
            const studentName = sanitizeInput(document.getElementById('studentName').value);
            const email = document.getElementById('studentEmail').value.trim().toLowerCase();
            const selectedClasses = [];
            document.querySelectorAll('.class-check:checked').forEach(cb => selectedClasses.push(cb.value));
            
            if (!studentName || !email || !selectedClasses.length) {
                showToast('Please fill name, email and select at least one class', 'error');
                return;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showToast('Please enter a valid email address', 'error');
                return;
            }
            
            isSubmitting = true;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Adding...';
            
            try {
                const oneYearLater = new Date();
                oneYearLater.setFullYear(oneYearLater.getFullYear() + 1);
                
                // Use email as document ID for direct lookup
                await db.collection('whitelist').doc(email).set({
                    studentName: studentName,
                    email: email,
                    allowedClasses: selectedClasses,
                    active: true,
                    expiresAt: firebase.firestore.Timestamp.fromDate(oneYearLater),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                showToast('Student added successfully!');
                closeModal();
                switchTab('whitelist');
                
            } catch (error) {
                console.error('Error adding to whitelist:', error);
                
                if (error.code === 'permission-denied') {
                    showToast('Permission denied. Check Firestore rules.', 'error');
                } else {
                    showToast('Failed to add student', 'error');
                }
            } finally {
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Student';
            }
        }

        async function addVideo() {
            if (isSubmitting) return;
            
            const title = sanitizeInput(document.getElementById('videoTitle').value);
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const videoClass = document.getElementById('videoClass').value;
            const subject = document.getElementById('videoSubject').value;
            const duration = sanitizeInput(document.getElementById('videoDuration').value);

        async function loadDashboard() {
            try {
                const [whitelist, videos, pdfs, images, posts] = await Promise.all([
                    db.collection('whitelist').where('active', '==', true).get().then(s => s.size),
                    db.collection('videos').get().then(s => s.size),
                    db.collection('pdfs').get().then(s => s.size),
                    db.collection('images').get().then(s => s.size),
                    db.collection('posts').get().then(s => s.size)
                ]);
                
                document.getElementById('adminContent').innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card"><span class="material-icons">verified_user</span><h2>${whitelist}</h2><p>Students</p></div>
                        <div class="stat-card"><span class="material-icons">video_library</span><h2>${videos}</h2><p>Videos</p></div>
                        <div class="stat-card"><span class="material-icons">picture_as_pdf</span><h2>${pdfs}</h2><p>PDFs</p></div>
                        <div class="stat-card"><span class="material-icons">image</span><h2>${images}</h2><p>Images</p></div>
                        <div class="stat-card"><span class="material-icons">article</span><h2>${posts}</h2><p>Posts</p></div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('adminContent').innerHTML = 
                    '<div class="empty-state"><span class="material-icons">error_outline</span><h3>Error</h3><p>Failed to load dashboard</p></div>';
            }
        }

        async function loadData(collection) {
            const contentArea = document.getElementById('adminContent');
            contentArea.innerHTML = '<div style="text-align:center;padding:2rem;">Loading...</div>';
            
            try {
                const snapshot = await db.collection(collection).get();
                cachedData = snapshot.docs.map(d => ({id:d.id, ...d.data()}));
                
                cachedData.sort((a, b) => {
                    const timeA = a.addedAt?.toMillis?.() || a.createdAt?.toMillis?.() || a.uploadedAt?.toMillis?.() || 0;
                    const timeB = b.addedAt?.toMillis?.() || b.createdAt?.toMillis?.() || b.uploadedAt?.toMillis?.() || 0;
                    return timeB - timeA;
                });
                
                displayedCount = 0;
                contentArea.innerHTML = '';
                appendData();
                
            } catch (error) {
                console.error('Error loading data:', error);
                contentArea.innerHTML = 
                    '<div class="empty-state"><span class="material-icons">error_outline</span><h3>Error</h3><p>Failed to load data</p></div>';
            }
        }

        function appendData() {
            const contentArea = document.getElementById('adminContent');
            const allData = cachedData;
            
            if (!allData.length) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">inbox</span>
                        <h3>No Data</h3>
                        <p>Add your first item</p>
                    </div>
                `;
                return;
            }
            
            const existingLoadMore = contentArea.querySelector('.load-more-btn');
            if (existingLoadMore) existingLoadMore.remove();
            
            let tableContainer = contentArea.querySelector('.table-container');
            if (!tableContainer) {
                tableContainer = document.createElement('div');
                tableContainer.className = 'table-container';
                contentArea.appendChild(tableContainer);
            }
            
            let table = tableContainer.querySelector('.data-table');
            if (!table) {
                table = document.createElement('table');
                table.className = 'data-table';
                tableContainer.appendChild(table);
                
                const thead = document.createElement('thead');
                let headerRow = '';
                
                if (currentTab === 'whitelist') {
                    headerRow = '<tr><th>Name</th><th>Email</th><th>Classes</th><th>Status</th><th>Actions</th></tr>';
                } else if (currentTab === 'videos') {
                    headerRow = '<tr><th>Title</th><th>Class</th><th>Subject</th><th>Actions</th></tr>';
                } else if (currentTab === 'pdfs') {
                    headerRow = '<tr><th>Title</th><th>Class</th><th>Subject</th><th>Actions</th></tr>';
                } else if (currentTab === 'images') {
                    headerRow = '<tr><th>Title</th><th>Class</th><th>Subject</th><th>Actions</th></tr>';
                } else if (currentTab === 'posts') {
                    headerRow = '<tr><th>Title</th><th>Classes</th><th>Subject</th><th>Actions</th></tr>';
                }
                
                thead.innerHTML = headerRow;
                table.appendChild(thead);
                
                const tbody = document.createElement('tbody');
                tbody.id = 'tableBody';
                table.appendChild(tbody);
            }
            
            const tbody = table.querySelector('#tableBody') || table.querySelector('tbody');
            
            const startIndex = displayedCount;
            const endIndex = Math.min(startIndex + PAGE_SIZE, allData.length);
            const batchData = allData.slice(startIndex, endIndex);
            
            batchData.forEach(item => {
                let rowHtml = '';
                
                if (currentTab === 'whitelist') {
                    const statusBadge = item.active ? 
                        '<span class="email-badge active">Active</span>' : 
                        '<span class="email-badge inactive">Inactive</span>';
                    
                    rowHtml = `<tr>
                        <td>${escapeHtml(item.studentName || 'N/A')}</td>
                        <td>${escapeHtml(item.email || '')}</td>
                        <td>${escapeHtml((item.allowedClasses||[]).join(', '))}</td>
                        <td>${statusBadge}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteItem('whitelist','${escapeHtml(item.id)}','${escapeHtml(item.studentName || item.email)}')">Remove</button></td>
                    </tr>`;
                } else if (currentTab === 'videos') {
                    rowHtml = `<tr>
                        <td>${escapeHtml(item.title || '')}</td>
                        <td>${escapeHtml(item.class || '-')}</td>
                        <td>${escapeHtml(item.subject || '-')}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteItem('videos','${escapeHtml(item.id)}','${escapeHtml(item.title || '')}')">Delete</button></td>
                    </tr>`;
                } else if (currentTab === 'pdfs') {
                    rowHtml = `<tr>
                        <td>${escapeHtml(item.title || '')}</td>
                        <td>${escapeHtml(item.class || '-')}</td>
                        <td>${escapeHtml(item.subject || '-')}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteItem('pdfs','${escapeHtml(item.id)}','${escapeHtml(item.title || '')}')">Delete</button></td>
                    </tr>`;
                } else if (currentTab === 'images') {
                    rowHtml = `<tr>
                        <td>${escapeHtml(item.title || '')}</td>
                        <td>${escapeHtml(item.class || '-')}</td>
                        <td>${escapeHtml(item.subject || '-')}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteItem('images','${escapeHtml(item.id)}','${escapeHtml(item.title || '')}')">Delete</button></td>
                    </tr>`;
                } else if (currentTab === 'posts') {
                    rowHtml = `<tr>
                        <td>${escapeHtml(item.title || '')}</td>
                        <td>${escapeHtml((item.class||[]).join(', '))}</td>
                        <td>${escapeHtml(item.subject || '-')}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteItem('posts','${escapeHtml(item.id)}','${escapeHtml(item.title || '')}')">Delete</button></td>
                    </tr>`;
                }
                
                tbody.insertAdjacentHTML('beforeend', rowHtml);
            });
            
            displayedCount = endIndex;
            
            if (displayedCount < allData.length) {
                const loadMoreBtn = document.createElement('button');
                loadMoreBtn.className = 'load-more-btn';
                loadMoreBtn.textContent = `Load More (${allData.length - displayedCount} remaining)`;
                loadMoreBtn.onclick = appendData;
                contentArea.appendChild(loadMoreBtn);
            }
        }

        async function deleteItem(collection, id, name) {
            if (confirm(`Delete "${name}"? This action cannot be undone.`)) {
                try {
                    await db.collection(collection).doc(id).delete();
                    showToast('Deleted successfully');
                    switchTab(collection);
                } catch (error) {
                    console.error('Delete error:', error);
                    showToast('Failed to delete', 'error');
                }
            }
        }

        function logout() {
            if (confirm('Logout from admin panel?')) {
                auth.signOut();
                window.location.href = 'index.html';
            }
        }

        checkAdminAuth();
    </script>
