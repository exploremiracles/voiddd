<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin — Campus Unfolded</title>
    <meta name="theme-color" content="#DFDDD3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
    <meta name="robots" content="noindex, nofollow">

    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                   font-src 'self' https://fonts.gstatic.com;
                   img-src 'self' data: blob: https:;
                   connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;
                   frame-src https://*.firebaseapp.com;
                   object-src 'none';
                   base-uri 'self';
                   form-action 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <style>
        /* ============ THEME ============ */
        :root {
            --bg: #DFDDD3;
            --text: #233130;
            --text-secondary: #85937D;
            --surface: #FFFFFF;
            --surface-muted: #EFEEE8;
            --border: #C5C3B8;
            --shadow-sm: 0 2px 4px rgba(35,49,48,0.1);
            --shadow-md: 0 8px 16px rgba(35,49,48,0.15);
            --shadow-lg: 0 16px 32px rgba(35,49,48,0.2);
            --accent: #5a745f;
            --accent-hover: #4a6353;
            --accent-contrast: #FFFFFF;
            --danger: #DC2626;
            --danger-hover: #B91C1C;
            --success: #059669;
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.25s ease;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
            --touch-min: 44px;
        }

        /* ============ BASE ============ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.5;
        }

        [hidden] { display: none !important; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 6px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* ============ LOGIN SCREEN ============ */
        .login-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 1rem;
            padding-top: calc(1rem + env(safe-area-inset-top, 0));
            padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0));
        }

        .login-box {
            background: var(--surface);
            border-radius: var(--radius);
            padding: clamp(1.5rem, 4vw, 2.25rem);
            box-shadow: var(--shadow-lg);
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--text-secondary), var(--accent));
            background-size: 200% 100%;
            animation: loginBarSlide 4s linear infinite;
        }

        @keyframes loginBarSlide {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .login-box .logo {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--text), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .login-box h2 {
            font-family: var(--font-heading);
            margin-bottom: 0.5rem;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
        }

        .login-box p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .admin-container {
            display: none;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .admin-container.active { display: flex; }

        /* ============ SIDEBAR ============ */
        .admin-sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            position: fixed;
            top: 0; left: 0; bottom: 0;
            padding: 0.75rem;
            padding-top: calc(0.75rem + env(safe-area-inset-top, 0));
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .admin-sidebar-header {
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .logo-text {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--text), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .close-sidebar-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text);
            padding: 6px;
            border-radius: 6px;
            min-width: var(--touch-min);
            min-height: var(--touch-min);
            align-items: center;
            justify-content: center;
        }

        .admin-sidebar nav { display: flex; flex-direction: column; }

        .admin-sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            min-height: var(--touch-min);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 3px;
            font-size: 0.9rem;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        .admin-sidebar-item:hover { background: var(--surface-muted); color: var(--text); }
        .admin-sidebar-item.active { background: var(--text); color: var(--bg); }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        /* ============ MAIN ============ */
        .admin-main {
            flex: 1;
            margin-left: 250px;
            padding: clamp(1rem, 2vw, 1.5rem);
            min-width: 0;
            padding-top: calc(clamp(1rem, 2vw, 1.5rem) + env(safe-area-inset-top, 0));
        }

        /* ============ TOP BAR ============ */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .top-bar-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }

        .mobile-menu-btn {
            display: none;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px;
            cursor: pointer;
            color: var(--text);
            min-width: var(--touch-min);
            min-height: var(--touch-min);
            align-items: center;
            justify-content: center;
        }

        .admin-title {
            font-family: var(--font-heading);
            font-size: clamp(1.3rem, 3vw, 1.8rem);
            font-weight: 700;
            word-break: break-word;
        }

        .top-bar-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        .logout-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 16px;
            min-height: var(--touch-min);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .logout-btn:hover { background: var(--danger-hover); }

        /* ============ BUTTONS ============ */
        .btn {
            padding: 10px 18px;
            min-height: var(--touch-min);
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
            white-space: nowrap;
        }
        .btn-primary { background: var(--text); color: var(--bg); }
        .btn-primary:hover { background: var(--accent); color: var(--accent-contrast); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; min-height: 36px; }

        /* ============ FORMS ============ */
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            min-height: var(--touch-min);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
            transition: var(--transition);
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(90,116,95,0.12);
        }
        .form-textarea { resize: vertical; min-height: 80px; }

        .class-checkboxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.4rem;
            margin-bottom: 0.75rem;
            max-height: 260px;
            overflow-y: auto;
            padding: 4px;
        }

        .class-checkbox {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 8px;
            background: var(--surface-muted);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8rem;
            min-height: 38px;
        }
        .class-checkbox input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* ============ MODAL ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: clamp(0.5rem, 2vw, 1rem);
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .modal-overlay[style*="flex"] { opacity: 1; }

        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            max-height: 90dvh;
            overflow-y: auto;
            padding: clamp(1rem, 3vw, 1.5rem);
            animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            gap: 0.5rem;
        }

        .modal-title {
            font-family: var(--font-heading);
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            font-weight: 700;
        }

        .modal-close-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
            color: var(--text);
            padding: 6px;
            min-width: 36px;
            min-height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close-btn:hover { background: var(--surface-muted); }

        /* ============ TABLE ============ */
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            min-width: 600px;
        }
        .data-table th {
            padding: 12px;
            text-align: left;
            background: var(--surface-muted);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }
        .data-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            vertical-align: middle;
        }
        .data-table tr:last-child td { border-bottom: none; }

        /* ============ STATS ============ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.25rem;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .stat-card .material-icons { font-size: 2rem; color: var(--accent); }
        .stat-card h2 {
            margin-top: 0.35rem;
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            font-family: var(--font-heading);
            font-weight: 900;
        }
        .stat-card p { color: var(--text-secondary); font-size: 0.85rem; }

        /* ============ LOAD MORE / EMPTY ============ */
        .load-more-btn {
            display: block;
            margin: 1rem auto;
            padding: 12px 28px;
            min-height: var(--touch-min);
            border-radius: 24px;
            background: var(--surface);
            border: 2px solid var(--border);
            cursor: pointer;
            font-weight: 500;
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        .load-more-btn:hover { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }
        .empty-state .material-icons { font-size: 3rem; margin-bottom: 0.5rem; color: var(--accent); }
        .empty-state h3 { font-size: 1.1rem; margin-bottom: 0.25rem; color: var(--text); }
        .empty-state p { font-size: 0.85rem; }

        /* ============ TOAST ============ */
        .toast {
            position: fixed;
            bottom: calc(2rem + env(safe-area-inset-bottom, 0));
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: var(--text);
            color: var(--bg);
            padding: 12px 24px;
            border-radius: 10px;
            z-index: 3000;
            font-size: 0.9rem;
            box-shadow: var(--shadow-md);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: calc(100vw - 40px);
            text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); color: white; }
        .toast.success { background: var(--success); color: white; }

        /* ============ BADGES / ERRORS ============ */
        .email-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .email-badge.active { background: #D1FAE5; color: #059669; }
        .email-badge.inactive { background: #FEE2E2; color: #DC2626; }

        .error-message {
            background: #FEE2E2;
            color: #DC2626;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 0.75rem;
            display: none;
            font-size: 0.85rem;
            text-align: left;
            line-height: 1.4;
        }
        .error-message.show { display: block; }

        /* ============ SPINNER ============ */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        .spinner-lg {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            margin: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 900px) {
            .admin-sidebar { width: 240px; }
            .admin-main { margin-left: 240px; }
        }

        @media (max-width: 768px) {
            .admin-sidebar {
                width: 280px;
                max-width: 85vw;
                transform: translateX(-100%);
                padding: 0.5rem;
                padding-top: calc(0.5rem + env(safe-area-inset-top, 0));
            }
            .admin-sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
            .close-sidebar-btn { display: flex; }
            .admin-main {
                margin-left: 0;
                padding: clamp(0.75rem, 2vw, 1rem);
                padding-top: calc(clamp(0.75rem, 2vw, 1rem) + env(safe-area-inset-top, 0));
            }
            .mobile-menu-btn { display: flex; }
            .admin-title { font-size: 1.4rem; }
            .top-bar-actions { width: 100%; justify-content: flex-end; }
            .btn { padding: 8px 14px; font-size: 0.78rem; }
            .modal-content { padding: 1rem; }
            .class-checkboxes { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
            .class-checkbox { padding: 6px; font-size: 0.72rem; }
            .stats-grid { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; }
            .stat-card { padding: 1rem; }
            .stat-card .material-icons { font-size: 1.6rem; }
        }

        @media (max-width: 480px) {
            .admin-title { font-size: 1.2rem; }
            .logout-btn, .btn { font-size: 0.72rem; }
            .logout-btn span:not(.material-icons),
            .btn span:not(.material-icons) { display: none; }
            .logout-btn, .btn { padding: 8px 12px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .modal-content { padding: 0.85rem; }
            .data-table th, .data-table td { padding: 8px; font-size: 0.75rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .toast { transition: none; }
            .modal-content { animation: none; }
            .login-box::before { animation: none; }
            .spinner { animation-duration: 2s; }
        }
    </style>
</head>
<body>

    <noscript>
        <div style="padding:2rem;text-align:center;font-family:sans-serif">
            <h2>JavaScript required</h2>
            <p>Please enable JavaScript to access the admin panel.</p>
        </div>
    </noscript>

    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="logo">Admin</div>
            <h2>Admin Login</h2>
            <p>Enter your credentials to access the admin panel</p>

            <div class="error-message" id="loginError" role="alert" aria-live="assertive">
                Invalid email or password. Please try again.
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); adminLogin();" autocomplete="on">
                <input type="email"
                       class="form-input"
                       id="adminEmail"
                       placeholder="Admin Email"
                       required
                       autocomplete="username"
                       inputmode="email"
                       spellcheck="false">
                <input type="password"
                       class="form-input"
                       id="adminPassword"
                       placeholder="Password"
                       required
                       autocomplete="current-password">
                <button type="submit"
                        class="btn btn-primary"
                        id="loginBtn"
                        style="width:100%">
                    <span class="material-icons" aria-hidden="true">lock</span>
                    <span>Login</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-container" id="adminContainer">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

        <aside class="admin-sidebar" id="adminSidebar" aria-label="Admin navigation">
            <div class="admin-sidebar-header">
                <span class="logo-text">Admin</span>
                <button class="close-sidebar-btn" onclick="closeSidebar()" aria-label="Close menu">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <nav>
                <button class="admin-sidebar-item active" data-tab="dashboard" onclick="handleMobileTabClick('dashboard')">
                    <span class="material-icons">dashboard</span><span>Dashboard</span>
                </button>
                <button class="admin-sidebar-item" data-tab="whitelist" onclick="handleMobileTabClick('whitelist')">
                    <span class="material-icons">verified_user</span><span>Students</span>
                </button>
                <button class="admin-sidebar-item" data-tab="videos" onclick="handleMobileTabClick('videos')">
                    <span class="material-icons">video_library</span><span>Videos</span>
                </button>
                <button class="admin-sidebar-item" data-tab="pdfs" onclick="handleMobileTabClick('pdfs')">
                    <span class="material-icons">picture_as_pdf</span><span>PDFs</span>
                </button>
                <button class="admin-sidebar-item" data-tab="images" onclick="handleMobileTabClick('images')">
                    <span class="material-icons">image</span><span>Images</span>
                </button>
                <button class="admin-sidebar-item" data-tab="posts" onclick="handleMobileTabClick('posts')">
                    <span class="material-icons">article</span><span>Posts</span>
                </button>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="top-bar">
                <div class="top-bar-left">

    (function () {
        'use strict';

        // ============================================
        // CONFIG
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDQJeB1o4W6KnC_OlxGc1u1aPWsv40bICo",
            authDomain: "genesis-aec98.firebaseapp.com",
            projectId: "genesis-aec98",
            storageBucket: "genesis-aec98.firebasestorage.app",
            messagingSenderId: "1071823452533",
            appId: "1:1071823452533:web:ff7a7dd592249a6ea1fb3c"
        };

        // UX gate only. Firestore rules are the real security boundary.
        const ADMIN_EMAILS = ['khanshoib82@gmail.com'];

        const CONFIG = Object.freeze({
            PAGE_SIZE: 5,
            COLLECTIONS: ['whitelist', 'videos', 'pdfs', 'images', 'posts']
        });

        const allClasses = [
            'Class 6','Class 7','Class 8','Class 9','Class 10','Class 11','Class 12',
            'Jamia Entrance','JNU Entrance','DU Entrance','AMU Entrance','CUET'
        ];
        const allSubjects = [
            'Geography','History','Economics','Social Science','General Knowledge',
            'Mathematics','Hindi','Urdu','Computer','Biology','Zoology','Physics',
            'Chemistry','Science','English','Current Affairs','Quant','Coding','AI'
        ];

        // ============================================
        // FIREBASE INIT
        // ============================================
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================
        // STATE
        // ============================================
        let currentTab = 'dashboard';
        let cachedData = [];
        let displayedCount = 0;

        let loadToken = 0;
        let wasAuthenticated = false;
        let confirmCallback = null;

        // ============================================

        // ============================================
        const $ = (id) => document.getElementById(id);

        function escapeHtml(text) {
            if (text == null) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function isAdminEmail(email) {
            if (!email) return false;
            const e = email.toLowerCase().trim();
            return ADMIN_EMAILS.some((a) => a.toLowerCase() === e);
        }

        function showToast(message, type = 'success') {
            const toast = $('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');

        }

        function showConfirm(message, onConfirm) {
            $('confirmMessage').textContent = message;
            confirmCallback = onConfirm;
            $('confirmOverlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeConfirm() {
            $('confirmOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';
            confirmCallback = null;
        }

        function loadingHtml(label = 'Loading...') {
            return `<div class="empty-state">
                <div class="spinner spinner-lg"></div>
                <p style="margin-top:0.75rem;">${escapeHtml(label)}</p>
            </div>`;
        }

        // ============================================
        // AUTH
        // ============================================
        async function adminLogin() {
            const email = $('adminEmail').value.trim().toLowerCase();
            const password = $('adminPassword').value;
            const loginBtn = $('loginBtn');
            const loginError = $('loginError');

            if (!email || !password) {
                loginError.textContent = 'Please enter email and password.';
                loginError.classList.add('show');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span><span>Logging in...</span>';
            loginError.classList.remove('show');

            try {
                await auth.signInWithEmailAndPassword(email, password);
                $('adminPassword').value = '';
            } catch (error) {
                console.error('[Admin] Login error:', error.code);
                const messages = {
                    'auth/invalid-email': 'Invalid email format.',
                    'auth/user-not-found': 'No account found with this email.',
                    'auth/wrong-password': 'Incorrect password.',
                    'auth/invalid-credential': 'Incorrect email or password.',
                    'auth/too-many-requests': 'Too many attempts. Try again in a few minutes.',
                    'auth/user-disabled': 'This account has been disabled.',
                    'auth/network-request-failed': 'Network error. Check your connection.'
                };
                loginError.textContent = messages[error.code] || 'Login failed. Please try again.';
                loginError.classList.add('show');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span class="material-icons" aria-hidden="true">lock</span><span>Login</span>';
            }
        }

        function adminLogout() {
            showConfirm('Logout from admin panel?', async () => {
                try {
                    await auth.signOut();
                    closeConfirm();
                } catch (error) {
                    console.error('[Admin] Logout error:', error);
                }
            });
        }

        // Watch auth state — show/hide UI based on real signed-in user
        auth.onAuthStateChanged(async (user) => {
            if (user && isAdminEmail(user.email)) {
                // Verify Firestore rules recognize this user as admin
                try {
                    await db.collection('whitelist').limit(1).get();
                } catch (err) {
                    console.error('[Admin] Rules rejected admin read:', err.code);
                    await auth.signOut();
                    const loginError = $('loginError');
                    loginError.textContent =
                        'Your account is not recognized as admin by Firestore rules. ' +
                        'Verify khanshoib82@gmail.com is in the isAdmin() check.';
                    loginError.classList.add('show');
                    return;
                }

                $('loginScreen').style.display = 'none';
                $('adminContainer').classList.add('active');

                if (!wasAuthenticated) {
                    wasAuthenticated = true;
                    switchTab('dashboard');
                }
            } else {
                if (user) await auth.signOut(); // signed in but not admin
                $('loginScreen').style.display = 'flex';
                $('adminContainer').classList.remove('active');
                wasAuthenticated = false;
            }
        });

        // ============================================
        // NAVIGATION
        // ============================================
        function openSidebar() {
            $('adminSidebar').classList.add('open');
            $('sidebarOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            $('adminSidebar').classList.remove('open');
            $('sidebarOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function handleMobileTabClick(tab) {
            if (window.innerWidth <= 768) closeSidebar();
            switchTab(tab);
        }

        function switchTab(tab) {
            if (!CONFIG.COLLECTIONS.includes(tab) && tab !== 'dashboard') return;

            currentTab = tab;
            cachedData = [];
            displayedCount = 0;
            loadToken++;

            document.querySelectorAll('.admin-sidebar-item').forEach((item) => {
                item.classList.toggle('active', item.dataset.tab === tab);
            });

            const titles = {
                dashboard: 'Dashboard',
                whitelist: 'Student Management',
                videos: 'Video Management',
                pdfs: 'PDF Management',
                images: 'Image Management',
                posts: 'Post Management'
            };
            $('adminTitle').textContent = titles[tab] || 'Dashboard';

            const addBtn = $('addBtn');
            if (tab === 'dashboard') addBtn.setAttribute('hidden', '');
            else addBtn.removeAttribute('hidden');

            if (tab === 'dashboard') loadDashboard();
            else loadData(tab);
        }

        // ============================================
        // DASHBOARD — reliable get().size for everything
        // ============================================
        async function loadDashboard() {
            const contentArea = $('adminContent');
            contentArea.innerHTML = loadingHtml('Loading dashboard...');

            try {
                const [wSnap, vSnap, pSnap, iSnap, poSnap] = await Promise.all([
                    db.collection('whitelist').where('active', '==', true).get(),
                    db.collection('videos').get(),
                    db.collection('pdfs').get(),
                    db.collection('images').get(),
                    db.collection('posts').get()
                ]);

                const stats = {
                    students: wSnap.size,
                    videos:   vSnap.size,
                    pdfs:     pSnap.size,
                    images:   iSnap.size,
                    posts:    poSnap.size
                };

                console.log('[Admin] Dashboard stats:', stats);
                renderDashboardStats(contentArea, stats);
            } catch (error) {
                console.error('[Admin] Dashboard error:', {
                    code: error.code,
                    message: error.message,
                    name: error.name
                });

                contentArea.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">error_outline</span>
                        <h3>Failed to load dashboard</h3>
                        <p style="font-family:monospace;font-size:0.75rem;background:var(--surface-muted);padding:8px 12px;border-radius:8px;margin-top:0.5rem;word-break:break-word;">
                            ${escapeHtml(error.code || error.message || 'Unknown error')}
                        </p>
                        <p style="margin-top:0.75rem;font-size:0.78rem;color:var(--text-secondary);">
                            Open DevTools Console (F12) for full error details.
                        </p>
                    </div>
                `;
            }
        }

        function renderDashboardStats(contentArea, { students, videos, pdfs, images, posts }) {
            contentArea.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="material-icons" aria-hidden="true">verified_user</span>
                        <h2>${students}</h2>
                        <p>Students</p>
                    </div>
                    <div class="stat-card">
                        <span class="material-icons" aria-hidden="true">video_library</span>
                        <h2>${videos}</h2>
                        <p>Videos</p>
                    </div>

                        <p>Images</p>

        // ============================================
        // DATA LOADING
        // ============================================
        async function loadData(collection) {
            const myToken = ++loadToken;
            const contentArea = $('adminContent');
            contentArea.innerHTML = loadingHtml('Loading...');

            try {
                const limit = CONFIG.PAGE_SIZE * 3;
                const snapshot = await db.collection(collection).limit(limit).get();

                if (myToken !== loadToken) return; // stale

                cachedData = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));

                cachedData.sort((a, b) => {
                    const ta = a.uploadedAt?.toMillis?.() || a.createdAt?.toMillis?.() || a.addedAt?.toMillis?.() || 0;
                    const tb = b.uploadedAt?.toMillis?.() || b.createdAt?.toMillis?.() || b.addedAt?.toMillis?.() || 0;
                    return tb - ta;
                });

                displayedCount = 0;
                contentArea.innerHTML = '';
                appendData();
            } catch (error) {
                if (myToken !== loadToken) return;
                console.error('[Admin] Load data error:', error.code, error.message);
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">error_outline</span>
                        <h3>Failed to load data</h3>
                        <p>${escapeHtml(error.code || error.message || 'Unknown error')}</p>
                    </div>
                `;
            }
        }

        function appendData() {
            const contentArea = $('adminContent');
            const allData = cachedData;

            if (!allData.length) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">inbox</span>
                        <h3>No Data</h3>
                        <p>Add your first item</p>
                    </div>
                `;
                return;
            }

            contentArea.querySelector('.load-more-btn')?.remove();

            let tableContainer = contentArea.querySelector('.table-container');
            if (!tableContainer) {
                tableContainer = document.createElement('div');
                tableContainer.className = 'table-container';
                contentArea.appendChild(tableContainer);
            }

            let table = tableContainer.querySelector('.data-table');
            if (!table) {
                table = document.createElement('table');
                table.className = 'data-table';
                tableContainer.appendChild(table);

                const thead = document.createElement('thead');
                let headerRow = '';

                if (currentTab === 'whitelist') {
                    headerRow = '<tr><th>Name</th><th>Email</th><th>Classes</th><th>Status</th><th>Actions</th></tr>';
                } else if (currentTab === 'videos' || currentTab === 'pdfs' || currentTab === 'images') {
                    headerRow = '<tr><th>Title</th><th>Class</th><th>Subject</th><th>Actions</th></tr>';
                } else if (currentTab === 'posts') {
                    headerRow = '<tr><th>Title</th><th>Classes</th><th>Subject</th><th>Actions</th></tr>';
                }

                thead.innerHTML = headerRow;
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                tbody.id = 'tableBody';
                table.appendChild(tbody);
            }

            const tbody = table.querySelector('#tableBody') || table.querySelector('tbody');

            const startIndex = displayedCount;
            const endIndex = Math.min(startIndex + CONFIG.PAGE_SIZE, allData.length);
            const batchData = allData.slice(startIndex, endIndex);

            batchData.forEach((item) => {
                const tr = document.createElement('tr');

                if (currentTab === 'whitelist') {
                    const statusBadge = item.active
                        ? '<span class="email-badge active">Active</span>'
                        : '<span class="email-badge inactive">Inactive</span>';

                    tr.innerHTML = `
                        <td>${escapeHtml(item.studentName || 'N/A')}</td>
                        <td>${escapeHtml(item.email || '')}</td>
                        <td>${escapeHtml((item.allowedClasses || []).join(', '))}</td>
                        <td>${statusBadge}</td>
                        <td><button class="btn btn-danger btn-sm" data-delete-id="${escapeHtml(item.id)}" data-delete-name="${escapeHtml(item.studentName || item.email)}">Remove</button></td>
                    `;
                } else if (currentTab === 'videos' || currentTab === 'pdfs' || currentTab === 'images') {
                    tr.innerHTML = `
                        <td>${escapeHtml(item.title || '')}</td>
                        <td>${escapeHtml(item.class || '-')}</td>
                        <td>${escapeHtml(item.subject || '-')}</td>
                        <td><button class="btn btn-danger btn-sm" data-delete-id="${escapeHtml(item.id)}" data-delete-name="${escapeHtml(item.title || '')}">Delete</button></td>
                    `;
                } else if (currentTab === 'posts') {
                    tr.innerHTML = `
                        <td>${escapeHtml(item.title || '')}</td>
                        <td>${escapeHtml((item.class || []).join(', '))}</td>
                        <td>${escapeHtml(item.subject || '-')}</td>
                        <td><button class="btn btn-danger btn-sm" data-delete-id="${escapeHtml(item.id)}" data-delete-name="${escapeHtml(item.title || '')}">Delete</button></td>
                    `;
                }

                tbody.appendChild(tr);
            });

            displayedCount = endIndex;

            if (displayedCount < allData.length) {
                const loadMoreBtn = document.createElement('button');
                loadMoreBtn.className = 'load-more-btn';
                loadMoreBtn.textContent = `Load More (${allData.length - displayedCount} remaining)`;
                loadMoreBtn.onclick = appendData;
                contentArea.appendChild(loadMoreBtn);
            }
        }

        // ============================================

                modalBody.innerHTML = `

                    <select id="pdfClass" class="form-select">

                        ${allSubjects.map((sub) => `<option value="${escapeHtml(sub)}">${escapeHtml(sub)}</option>`).join('')}
                    </select>
                    <button class="btn btn-primary" onclick="addPDF()" id="submitBtn" style="width:100%;">Add PDF</button>
                `;
            } else if (currentTab === 'images') {
                modalBody.innerHTML = `
                    <input type="text" id="imageTitle" class="form-input" placeholder="Image Title" maxlength="100">
                    <input type="url" id="imageUrl" class="form-input" placeholder="Image URL" maxlength="500">
                    <select id="imageClass" class="form-select">
                        <option value="">Select Class</option>
                        ${allClasses.map((cls) => `<option value="${escapeHtml(cls)}">${escapeHtml(cls)}</option>`).join('')}
                    </select>
                    <select id="imageSubject" class="form-select">
                        <option value="">Select Subject</option>
                        ${allSubjects.map((sub) => `<option value="${escapeHtml(sub)}">${escapeHtml(sub)}</option>`).join('')}
                    </select>
                    <textarea id="imageDescription" class="form-textarea" placeholder="Description" rows="3" maxlength="500"></textarea>
                    <button class="btn btn-primary" onclick="addImage()" id="submitBtn" style="width:100%;">Add Image</button>
                `;
            } else if (currentTab === 'posts') {
                modalBody.innerHTML = `
                    <input type="text" id="postTitle" class="form-input" placeholder="Post Title" maxlength="100">
                    <textarea id="postContent" class="form-textarea" placeholder="Content" rows="4" maxlength="2000"></textarea>
                    <input type="url" id="postUrl" class="form-input" placeholder="URL (Optional)" maxlength="500">
                    <label style="font-weight:500;margin-bottom:0.4rem;display:block;font-size:0.85rem;">Target Classes:</label>
                    <div class="class-checkboxes">
                        ${allClasses.map((cls) => `
                            <label class="class-checkbox">
                                <input type="checkbox" value="${escapeHtml(cls)}" class="post-class-check"> ${escapeHtml(cls)}
                            </label>
                        `).join('')}
                    </div>
                    <select id="postSubject" class="form-select">
                        <option value="">Select Subject (Optional)</option>
                        ${allSubjects.map((sub) => `<option value="${escapeHtml(sub)}">${escapeHtml(sub)}</option>`).join('')}
                    </select>
                    <button class="btn btn-primary" onclick="addPost()" id="submitBtn" style="width:100%;">Add Post</button>
                `;
            }

            $('modalOverlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';

            const firstInput = modalBody.querySelector('input, select, textarea');
            firstInput?.focus();
        }

        function closeModal() {
            $('modalOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';
            isSubmitting = false;
        }

        // ============================================
        // ADD HANDLERS
        // ============================================
        async function addToWhitelist() {
            if (isSubmitting) return;

            const studentName = $('studentName').value.trim();
            const email = $('studentEmail').value.trim().toLowerCase();
            const selectedClasses = Array.from(document.querySelectorAll('.class-check:checked')).map((cb) => cb.value);

            if (!studentName || !email || !selectedClasses.length) {
                showToast('Please fill name, email and select at least one class', 'error');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showToast('Please enter a valid email address', 'error');
                return;
            }

            isSubmitting = true;
            const submitBtn = $('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Adding...';

            try {
                const oneYearLater = new Date();
                oneYearLater.setFullYear(oneYearLater.getFullYear() + 1);

                await db.collection('whitelist').doc(email).set({
                    studentName,
                    email,
                    allowedClasses: selectedClasses,
                    active: true,
                    expiresAt: firebase.firestore.Timestamp.fromDate(oneYearLater),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('Student added successfully!');
                closeModal();
                switchTab('whitelist');
            } catch (error) {
                console.error('[Admin] Add student error:', error.code);
                showToast('Failed to add student: ' + (error.code || 'unknown error'), 'error');
            } finally {
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Student';
            }
        }

        async function addVideo() {
            if (isSubmitting) return;

            const title = $('videoTitle').value.trim();
            const videoUrl = $('videoUrl').value.trim();
            const videoClass = $('videoClass').value;
            const subject = $('videoSubject').value;
            const duration = $('videoDuration').value.trim();
            const description = $('videoDescription').value.trim();

            if (!title || !videoUrl || !videoClass) {
                showToast('Please fill required fields', 'error');
                return;
            }

            isSubmitting = true;
            const submitBtn = $('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Adding...';

            try {
                await db.collection('videos').add({
                    title, videoUrl, class: videoClass, subject, duration, description,
                    uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showToast('Video added!');
                closeModal();
                switchTab('videos');
            } catch (error) {
                console.error('[Admin] Add video error:', error.code);
                showToast('Failed to add video: ' + (error.code || 'unknown error'), 'error');
            } finally {
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Video';
            }
        }

        async function addImage() {
            if (isSubmitting) return;

            const title = $('imageTitle').value.trim();
            const imageUrl = $('imageUrl').value.trim();
            const imageClass = $('imageClass').value;
            const subject = $('imageSubject').value;
            const description = $('imageDescription').value.trim();

            if (!title || !imageUrl || !imageClass) {

                await db.collection('images').add({
                    title, imageUrl, class: imageClass, subject, description,
                    uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showToast('Image added!');
                closeModal();
                switchTab('images');

                showToast('Failed to add image: ' + (error.code || 'unknown error'), 'error');

        async function addPost() {
            if (isSubmitting) return;

            const selectedClasses = Array.from(document.querySelectorAll('.post-class-check:checked')).map((cb) => cb.value);
            const title = $('postTitle').value.trim();
            const content = $('postContent').value.trim();
            const url = $('postUrl').value.trim();
            const subject = $('postSubject').value;

            if (!title || !content || !selectedClasses.length) {
                showToast('Please fill required fields and select at least one class', 'error');
                return;
            }

            isSubmitting = true;
            const submitBtn = $('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Adding...';

            try {
                await db.collection('posts').add({
                    title, content, url, class: selectedClasses, subject,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showToast('Post added!');
                closeModal();
                switchTab('posts');
            } catch (error) {
                console.error('[Admin] Add post error:', error.code);
                showToast('Failed to add post: ' + (error.code || 'unknown error'), 'error');
            } finally {
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Post';
            }
        }

        // ============================================
        // DELETE — delegated, no inline onclick with user data
        // ============================================
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-delete-id]');
            if (!btn) return;
            const id = btn.dataset.deleteId;
            const name = btn.dataset.deleteName || id;
            requestDelete(currentTab, id, name);
        });

        function requestDelete(collection, id, name) {
            showConfirm(`Delete "${name}"? This action cannot be undone.`, async () => {
                try {
                    await db.collection(collection).doc(id).delete();
                    showToast('Deleted successfully');
                    closeConfirm();
                    switchTab(collection);
                } catch (error) {
                    console.error('[Admin] Delete error:', error.code);
                    showToast('Failed to delete: ' + (error.code || 'unknown error'), 'error');
                }
            });
        }

        // ============================================
        // MODAL + CONFIRM DISMISS
        // ============================================
        $('modalOverlay').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        $('confirmOverlay').addEventListener('click', function (e) {
            if (e.target === this) closeConfirm();
        });

        $('confirmCancelBtn').addEventListener('click', closeConfirm);
        $('confirmOkBtn').addEventListener('click', () => {
            if (typeof confirmCallback === 'function') confirmCallback();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeConfirm();
                closeSidebar();
            }
        });

        // ============================================
        // EXPOSE GLOBALS (needed by inline onclick in generated forms)
        // ============================================
        window.adminLogin = adminLogin;
        window.adminLogout = adminLogout;
        window.openSidebar = openSidebar;
        window.closeSidebar = closeSidebar;
        window.handleMobileTabClick = handleMobileTabClick;
        window.showAddForm = showAddForm;
        window.closeModal = closeModal;
        window.addToWhitelist = addToWhitelist;
        window.addVideo = addVideo;
        window.addPDF = addPDF;
        window.addImage = addImage;
        window.addPost = addPost;
    })();
    </script>
</body>
</html>
